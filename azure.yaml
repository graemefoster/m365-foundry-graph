# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

infra:
    provider: microsoft.foundry
name: people-agent-sample
services:
    people-agent-native:
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: PeopleAgent.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
            Demo__StorageDirectory: /tmp/people-agent
            Graph__Enabled: "${GRAPH_ENABLED:-false}"
            Graph__OAuthConnectionName: "${GRAPH_OAUTH_CONNECTION_NAME:-graph-connector}"
            Graph__TenantId: "${GRAPH_TENANT_ID}"
            Graph__ClientId: "${GRAPH_CLIENT_ID}"
            Graph__ConnectionId: "${GRAPH_CONNECTION_ID}"
            Graph__ContentIsSynthetic: "${GRAPH_CONTENT_IS_SYNTHETIC:-true}"
        host: azure.ai.agent
        kind: hosted
        language: csharp
        name: people-agent-native
        project: src/PeopleAgent
        protocols:
            - protocol: activity
              version: 2.0.0
            - protocol: responses
              version: 2.0.0
        uses:
            - proj-default
    proj-default:
        endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
        host: azure.ai.project
